<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>pp-browser-storage</title>
    <style>
      html, body { margin: 0; padding: 0; height: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <script>
      /* Minimal Streamlit component protocol — chỉ thao tác storage của trình duyệt hiện tại. */
      function sendMessageToStreamlitClient(type, data) {
        const outData = Object.assign({ isStreamlitMessage: true, type: type }, data);
        window.parent.postMessage(outData, "*");
      }
      const Streamlit = {
        setComponentReady: function () {
          sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
        },
        setFrameHeight: function (height) {
          sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: height });
        },
        setComponentValue: function (value) {
          sendMessageToStreamlitClient("streamlit:setComponentValue", { value: value });
        },
        RENDER_EVENT: "streamlit:render",
        events: {
          addEventListener: function (type, callback) {
            window.addEventListener("message", function (event) {
              if (event.data && event.data.type === type) {
                event.detail = event.data;
                callback(event);
              }
            });
          },
        },
      };

      function lsGet(key) {
        try { return window.localStorage.getItem(key); } catch (e) { return null; }
      }
      function lsSet(key, value) {
        try {
          if (!value) { window.localStorage.removeItem(key); }
          else { window.localStorage.setItem(key, value); }
          return true;
        } catch (e) { return false; }
      }
      function ssGet(key) {
        try { return window.sessionStorage.getItem(key); } catch (e) { return null; }
      }
      function ssSet(key, value) {
        try {
          if (!value) { window.sessionStorage.removeItem(key); }
          else { window.sessionStorage.setItem(key, value); }
          return true;
        } catch (e) { return false; }
      }
      function cookieGet(name) {
        try {
          var parts = ("; " + document.cookie).split("; " + name + "=");
          if (parts.length === 2) return decodeURIComponent(parts.pop().split(";").shift() || "");
          return null;
        } catch (e) { return null; }
      }
      function cookieSet(name, value, maxAge) {
        try {
          if (!value) {
            document.cookie = name + "=; path=/; max-age=0; SameSite=Lax";
          } else {
            document.cookie =
              name + "=" + encodeURIComponent(value) +
              "; path=/; max-age=" + (maxAge || 31536000) + "; SameSite=Lax";
          }
          return true;
        } catch (e) { return false; }
      }

      function onRender(event) {
        var args = (event && event.detail && event.detail.args) || {};
        var mode = args.mode || "get";
        var key = args.storage_key || "pp_session_v1";
        var cookieKey = args.cookie_key || "pp_meta";
        var nonce = args.nonce || 0;

        if (mode === "get") {
          // Ưu tiên localStorage → sessionStorage → cookie meta (cờ nhỏ).
          var blob = lsGet(key) || ssGet(key) || null;
          Streamlit.setComponentValue({
            status: "ready",
            mode: "get",
            nonce: nonce,
            value: blob,
            cookie: cookieGet(cookieKey),
            sources: {
              localStorage: !!lsGet(key),
              sessionStorage: !!ssGet(key),
              cookie: !!cookieGet(cookieKey),
            },
          });
        } else if (mode === "set") {
          var okLs = lsSet(key, args.value || "");
          var okSs = ssSet(key, args.value || "");
          var okCk = true;
          if (args.cookie_value !== undefined && args.cookie_value !== null) {
            okCk = cookieSet(cookieKey, args.cookie_value, args.cookie_max_age || 31536000);
          }
          Streamlit.setComponentValue({
            status: "ready",
            mode: "set",
            nonce: nonce,
            ok: !!(okLs || okSs),
            ok_localStorage: okLs,
            ok_sessionStorage: okSs,
            ok_cookie: okCk,
          });
        } else if (mode === "clear") {
          Streamlit.setComponentValue({
            status: "ready",
            mode: "clear",
            nonce: nonce,
            ok: lsSet(key, "") && ssSet(key, "") && cookieSet(cookieKey, ""),
          });
        }
        Streamlit.setFrameHeight(0);
      }

      Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
      Streamlit.setComponentReady();
      Streamlit.setFrameHeight(0);
    </script>
  </body>
</html>
