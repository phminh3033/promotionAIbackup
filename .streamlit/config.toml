[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
headless = true
enableCORS = false
# Giới hạn upload khi nhiều người dùng thử cùng lúc (MB). Có thể ghi đè bằng DEMO_MAX_UPLOAD_MB ở tầng app.
maxUploadSize = 5
maxMessageSize = 200
